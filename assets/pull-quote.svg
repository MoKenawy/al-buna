<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <style>
      .bg { fill: #11131a; }
      .rule { stroke: #d9a441; stroke-width: 1.5; opacity: 0.6; }
      .quote {
        font-family: 'Amiri', 'Traditional Arabic', 'Noto Naskh Arabic', serif;
        fill: #e8e0cf;
        font-size: 44px;
        direction: rtl;
        unicode-bidi: bidi-override;
      }
      .gloss {
        font-family: 'IBM Plex Mono', 'Courier New', monospace;
        fill: #8c8475;
        font-size: 15px;
        letter-spacing: 0.5px;
      }
      .mark { fill: #d9a441; opacity: 0.5; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="300"/>
  <line class="rule" x1="120" y1="52" x2="1080" y2="52"/>
  <line class="rule" x1="120" y1="248" x2="1080" y2="248"/>

  <text class="mark" x="600" y="105" text-anchor="middle" font-size="28">”</text>

  <text class="quote" x="600" y="160" text-anchor="middle">الكرسيُّ الفارغُ لا يخدعُك، هو فقط لا يُجيب</text>

  <text class="gloss" x="600" y="205" text-anchor="middle">THE EMPTY CHAIR DOESN&#8217;T DECEIVE YOU — IT JUST DOESN&#8217;T ANSWER</text>

  <text class="gloss" x="600" y="228" text-anchor="middle" opacity="0.7">رسالةٌ لا تصل · al-Buna</text>
</svg>
